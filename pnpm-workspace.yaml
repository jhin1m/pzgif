allowBuilds:
  # Both are transitive dev-only native deps off the build/test/lint path — the
  # full suite (tsc, vitest, next build) passes with neither binary compiled, so
  # their postinstall is skipped. Left unresolved, pnpm 11 treats a pending
  # build-script approval as a hard `ERR_PNPM_IGNORED_BUILDS` and fails install.
  "@parcel/watcher": false
  "@swc/core": false
  # The Cloudflare adapter bundles the worker with esbuild and runs it on
  # workerd; both need their postinstall to fetch the platform binary.
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
minimumReleaseAgeExclude:
  - "@next/env@16.3.0"
  - "@next/eslint-plugin-next@16.3.0"
  - "@next/swc-darwin-arm64@16.3.0"
  - "@next/swc-darwin-x64@16.3.0"
  - "@next/swc-linux-arm64-gnu@16.3.0"
  - "@next/swc-linux-arm64-musl@16.3.0"
  - "@next/swc-linux-x64-gnu@16.3.0"
  - "@next/swc-linux-x64-musl@16.3.0"
  - "@next/swc-win32-arm64-msvc@16.3.0"
  - "@next/swc-win32-x64-msvc@16.3.0"
  - eslint-config-next@16.3.0
  - icu-minify@4.13.5
  - next-intl-swc-plugin-extractor@4.13.5
  - next-intl@4.13.5
  - next@16.3.0
  - use-intl@4.13.5
