<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">PZGIF — GIF tools that never upload your file</title>
  <desc id="dsc">A GIF toolset that decodes, transforms and re-encodes entirely inside your own browser tab. Nothing is uploaded.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3D5AFE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3D5AFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0E9C93" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0E9C93" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="440" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#FFFFFF"/>
    <circle cx="1040" cy="-40" r="360" fill="url(#glowA)"/>
    <circle cx="140" cy="480" r="320" fill="url(#glowB)"/>
  </g>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F5DE8"/>
      <stop offset="100%" stop-color="#0E9C93"/>
    </linearGradient>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#F0F1F5"/>
      <rect width="8" height="8" fill="#E4E7ED"/>
      <rect x="8" y="8" width="8" height="8" fill="#E4E7ED"/>
    </pattern>
  </defs>
  <rect x="0.75" y="0.75" width="1278.5" height="438.5" rx="24" fill="none" stroke="#E1E4EA" stroke-width="1.5"/>
  <text x="80" y="98" font-size="11.5" fill="#2F5DE8" font-weight="700" letter-spacing="1.6">BROWSER-NATIVE GIF TOOLSET</text>
  <text x="76" y="212" font-size="104" font-weight="800" letter-spacing="-4.5" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><tspan fill="#111827">PZ</tspan><tspan fill="url(#mark)">GIF</tspan></text>
  <text x="80" y="262" font-size="27" fill="#111827" font-weight="650">Nothing leaves your machine.</text>
  <text x="80" y="296" font-size="27" fill="#6B7280">Because nothing was ever sent.</text>
  <rect x="80" y="336" width="98" height="32" rx="16" fill="#F8F9FB" stroke="#E1E4EA" stroke-width="1.25"/>
  <text x="129.0" y="356.86" font-size="13.5" fill="#374151" font-weight="600" text-anchor="middle">no upload</text>
  <rect x="190" y="336" width="106" height="32" rx="16" fill="#F8F9FB" stroke="#E1E4EA" stroke-width="1.25"/>
  <text x="243.0" y="356.86" font-size="13.5" fill="#374151" font-weight="600" text-anchor="middle">no account</text>
  <rect x="308" y="336" width="90" height="32" rx="16" fill="#F8F9FB" stroke="#E1E4EA" stroke-width="1.25"/>
  <text x="353.0" y="356.86" font-size="13.5" fill="#374151" font-weight="600" text-anchor="middle">no queue</text>
  <rect x="744" y="84" width="456" height="252" rx="18" fill="#F8F9FB" stroke="#E1E4EA" stroke-width="1.5"/>
  <line x1="744" y1="124" x2="1200" y2="124" stroke="#E1E4EA" stroke-width="1.25" stroke-linecap="butt"/>
  <circle cx="770" cy="104" r="4.5" fill="#C7CCD6"/>
  <circle cx="787" cy="104" r="4.5" fill="#C7CCD6"/>
  <circle cx="804" cy="104" r="4.5" fill="#C7CCD6"/>
  <rect x="836" y="93" width="232" height="22" rx="11" fill="#F0F1F5"/>
  <text x="852" y="108.5" font-size="11.5" fill="#6B7280" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">pzgif.com/gif-compressor</text>
  <rect x="770" y="150" width="176" height="112" rx="10" fill="url(#chk)" stroke="#E1E4EA" stroke-width="1.25"/>
  <rect x="770" y="236" width="176" height="26" fill="#FFFFFF" opacity="0.82"/>
  <text x="782" y="253" font-size="11" fill="#6B7280" font-weight="500" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">frame 82 / 120</text>
  <circle cx="822" cy="196" r="13.0" fill="#2F5DE8" opacity="0.25"/>
  <circle cx="852" cy="196" r="11.5" fill="#2F5DE8" opacity="0.5"/>
  <circle cx="882" cy="196" r="10.0" fill="#2F5DE8" opacity="1"/>
  <text x="970" y="168" font-size="15" fill="#6B7280" font-weight="500" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">12.4 MB</text>
  <line x1="970" y1="163" x2="1038" y2="163" stroke="#6B7280" stroke-width="1.25" stroke-linecap="round"/>
  <text x="970" y="212" font-size="34" fill="#0B7A73" font-weight="750">3.1 MB</text>
  <rect x="970" y="230" width="53" height="28" rx="14" fill="#DEF3F1" stroke="#DEF3F1" stroke-width="1.25"/>
  <text x="996.5" y="248.68" font-size="13" fill="#0B7A73" font-weight="700" text-anchor="middle">−75%</text>
  <text x="770" y="292" font-size="11.5" fill="#6B7280" font-weight="500" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">encoding · gifski</text>
  <text x="1174" y="292" font-size="11.5" fill="#0B7A73" font-weight="700" text-anchor="end" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">68%</text>
  <rect x="770" y="304" width="404" height="8" rx="4" fill="#F0F1F5"/>
  <rect x="770" y="304" width="275" height="8" rx="4" fill="#0E9C93"/>
  <circle cx="756" cy="384" r="9" fill="none" stroke="#0B7A73" stroke-width="1.5"/>
  <path d="M 751,384 L 755,388 L 762,379" fill="none" stroke="#0B7A73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="776" y="389" font-size="15" fill="#0B7A73" font-weight="650" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">0 bytes uploaded</text>
</svg>
