name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The governing constraint of the whole project: no page may be
      # cross-origin isolated. Runs first so a violation fails in seconds.
      - name: Check for cross-origin-isolation constructs
        run: pnpm check:forbidden

      - name: Typecheck
        run: pnpm typecheck

      # Next 16 removed `next lint`, and `next build` no longer lints. Without
      # this explicit step nothing would run ESLint at all.
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Every page is a static shell. A route that quietly turns dynamic costs
      # the CDN cache, the LCP, and the rankings this business depends on.
      - name: Check every route is statically prerendered
        run: pnpm check:static

      # ffmpeg.wasm is ~10 MB and serves an estimated 1-3% of jobs. It must stay
      # out of the shared client chunks, and a static import would undo that
      # silently.
      - name: Check no heavyweight decoder is bundled
        run: pnpm check:heavy

      # The landing page boots no engine — no worker, no WASM loader, no
      # capability detection — and nothing outside a client module touches the
      # file handoff. Both erode the first time somebody imports something
      # convenient into a shared component.
      - name: Check the landing page stays engine-free
        run: pnpm check:landing

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests
        run: pnpm test:e2e

      # The adapter build is the only path that actually ships, and it is the
      # most fragile thing here: `src/middleware.ts` is a workaround for an
      # adapter limitation, on a removal schedule set by the Next team. Without
      # this step the first sign of either changing would be a failed deploy.
      #
      # It does not assert the runtime — that needs workerd, which
      # `playwright.config.ts` does not drive. See the runbook.
      - name: Check the Cloudflare adapter build still succeeds
        run: pnpm cf:build

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # `/dev/states` is not in a production build, so the `verify` job above skips
  # the whole component-gallery suite — and with it the only automated coverage
  # of focus order, computed styles and the WebKit `hidden="until-found"`
  # behaviour. That coverage is the reason the gallery exists; losing it silently
  # to a deployment fix would be a bad trade made by accident.
  #
  # This job rebuilds with the route opted in and runs that suite alone. It also
  # proves the page still compiles, which the main build no longer does.
  component-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PZGIF_ENABLE_DEV_ROUTES: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e component-states

  # AGPL-3.0 §6 requires the Corresponding Source for the version conveyed.
  # Deploying a commit that is not public would breach it, so this gates main.
  source-offer:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Only the script is needed — it fetches the commit anonymously from the
      # public URL rather than inspecting this checkout, so a shallow clone with
      # credentials would prove nothing.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify the deployed commit's source is anonymously fetchable
        run: node scripts/check-source-sha.mjs
