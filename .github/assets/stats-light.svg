<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 138" width="1280" height="138" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">PZGIF in three numbers</title>
  <desc id="dsc">Zero bytes leave the machine, nine tools share one engine, and all of it runs in a single Web Worker.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3D5AFE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3D5AFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0E9C93" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0E9C93" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="138" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="138" fill="#FFFFFF"/>
    <circle cx="1040" cy="-40" r="207" fill="url(#glowA)"/>
    <circle cx="140" cy="178" r="179" fill="url(#glowB)"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="136.5" rx="18" fill="none" stroke="#E1E4EA" stroke-width="1.5"/>
  <text x="48.0" y="80" font-size="50" fill="#0B7A73" font-weight="750">0</text>
  <text x="88.0" y="80" font-size="20" fill="#111827" font-weight="650">bytes</text>
  <text x="50.0" y="106" font-size="13.5" fill="#6B7280" font-weight="450">leave the machine, ever</text>
  <line x1="426.6666666666667" y1="30" x2="426.6666666666667" y2="108" stroke="#E1E4EA" stroke-width="1.25" stroke-linecap="round"/>
  <text x="474.6666666666667" y="80" font-size="50" fill="#0B7A73" font-weight="750">9</text>
  <text x="514.6666666666667" y="80" font-size="20" fill="#111827" font-weight="650">tools</text>
  <text x="476.6666666666667" y="106" font-size="13.5" fill="#6B7280" font-weight="450">plus a Discord preset cluster</text>
  <line x1="853.3333333333334" y1="30" x2="853.3333333333334" y2="108" stroke="#E1E4EA" stroke-width="1.25" stroke-linecap="round"/>
  <text x="901.3333333333334" y="80" font-size="50" fill="#0B7A73" font-weight="750">1</text>
  <text x="941.3333333333334" y="80" font-size="20" fill="#111827" font-weight="650">worker</text>
  <text x="903.3333333333334" y="106" font-size="13.5" fill="#6B7280" font-weight="450">the main thread never decodes a frame</text>
</svg>
